<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자관련태그</title>
</head>
<body>
    <h1>글자 관련 태그</h1>

    <!-- 제목 지정 태그 -->
     <h1>제목01</h1>
     <h2>제목02</h2>
     <h3>제목03</h3>
     <h4>제목04</h4>
     <h5>제목05</h5>
     <h6>제목06</h6>

     <!-- 수평선 -->
      <hr />

      <!-- 줄바꿈 -->
       안녕<br />하세요

       <!--단락 구분 -->
       <p>
        피태그
       </p>

       <pre>
        피알이
        엔터랑 띄 어   쓰 기 그대로

        적용 ㅎ
       </pre>

       <hr>

       <strong>굵은 글자</strong>
       <!-- <b>굵은 글자</b> -->

       <br />
       <i>아이태그</i>
       <em>이탤릭</em>

       <br />
       
       <mark>형광펜</mark>

       <br />

       <s>취소선</s>

       <br />

       <small>작은글자</small>

       <p>
            <span>기본글자</span>
            <sup>위첨자</sup>
            <sub>아래첨자</sub>
       </p>
</body>
</html>
